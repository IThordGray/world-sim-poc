<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Living World Weather</title>
  <style>
    :root {
      --bg: #0d141c; --panel: #151f2b; --line: #263445; --text: #dbe4ee; --muted: #8597aa; --accent: #f0b354;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
    h1 { font-size: 15px; font-weight: 600; margin: 0 8px 0 0; letter-spacing: .02em; }
    .group { display: flex; gap: 4px; align-items: center; }
    .group label { color: var(--muted); margin-right: 4px; }
    button, select, input { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
    button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
    input[type="number"] { width: 6em; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; padding: 16px; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    .map { position: relative; width: 100%; aspect-ratio: 2 / 1; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #0b2a4a; }
    .map { cursor: grab; touch-action: none; user-select: none; }
    .map.dragging { cursor: grabbing; }
    .map canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #zoom-level { min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
    #status[hidden] { display: none; }
    aside { display: flex; flex-direction: column; gap: 12px; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    section h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; font-variant-numeric: tabular-nums; }
    .legend span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; border: 2px solid; }
    .legend div { margin: 2px 0; }
    .note { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Living World Weather</h1>
    <div class="group"><button id="play">Pause</button></div>
    <div class="group" id="speeds"><label>Speed</label></div>
    <div class="group">
      <label for="layer">Layer</label>
      <select id="layer">
        <option value="weather">Weather (cloud &amp; rain)</option>
        <option value="pressure">Pressure</option>
        <option value="wind">Wind (Beaufort)</option>
        <option value="temperature">Temperature</option>
      </select>
    </div>
    <div class="group">
      <label>Zoom</label>
      <button id="zoom-out" aria-label="Zoom out">−</button>
      <span id="zoom-level">1.0×</span>
      <button id="zoom-in" aria-label="Zoom in">+</button>
      <button id="zoom-reset">Reset</button>
    </div>
    <div class="group"><label><input type="checkbox" id="particles" checked /> Wind particles</label></div>
    <div class="group">
      <label for="seed">Seed</label><input id="seed" type="number" min="0" step="1" />
      <button id="regen">New world</button>
    </div>
  </header>
  <main>
    <div class="map" id="map">
      <canvas id="base"></canvas>
      <canvas id="trails"></canvas>
      <canvas id="overlay"></canvas>
      <div id="status">Generating world…</div>
    </div>
    <aside>
      <section><h2>Time</h2><dl id="time"></dl></section>
      <section><h2>Under the cursor</h2><dl id="cell"><dt>—</dt><dd>Hover the map</dd></dl></section>
      <section class="legend">
        <h2>Pressure systems</h2>
        <div><span style="border-color:#5aa9ff"></span>Semi-permanent high</div>
        <div><span style="border-color:#ff7a59"></span>Depression</div>
        <div><span style="border-color:#e05cff"></span>Tropical storm</div>
        <div><span style="border-color:#ffd166"></span>Squall</div>
        <p class="note">A dashed ring is a system still Forming: storms are telegraphed before they reach full strength.</p>
      </section>
    </aside>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
